name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + config_tool deps
        # config_tool 的 web 依赖(fastapi/uvicorn/jinja2)此前未声明,导致
        # tests/test_config_tool_name_guard.py 收集期 ModuleNotFoundError 而 CI 长期红。
        run: |
          pip install ".[config-tool,dev]"

      - name: Run tests
        run: |
          python -m pytest tests -v
