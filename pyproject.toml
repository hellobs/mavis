[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mavisframework"
version = "1.3.0"
description = "MAVIS 生成式多智能体仿真框架(自研,零外部 AI 依赖)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# config_tool 的 web 依赖此前**从未声明**(CI 只装 `pip install .`,于是
# tests/test_config_tool_name_guard.py 收集期 ModuleNotFoundError,CI 长期红)。
# 声明在这里,CI 用 .[config-tool,dev] 一次装齐。
config-tool = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

# 标准布局:包在 mavisframework/ 子目录
[tool.setuptools]
packages = [
    "mavisframework",
    "mavisframework.config",
    "mavisframework.core",
    "mavisframework.output",
    "mavisframework.prompt",
    "mavisframework.runtime",
    "mavisframework.scene",
]

[tool.setuptools.package-data]
mavisframework = ["prompts/*.txt"]
